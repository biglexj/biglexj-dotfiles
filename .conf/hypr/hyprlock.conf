--------------------- USER --------------------

# AVATAR
image {
    monitor                 =
    path                    = $img/miku.jpg
    border_color            = $foreground-alt
    border_size             = 0
    size                    = 240
    rounding                = 15
    rotate                  = 0
    opacity                 = 1

    reload_time             = -1
    reload_cmd              =

    position                = 95, 70
    halign                  = left
    valign                  = bottom
}



-------------------- INPUT --------------------

# INPUT BOX
input-field {
    monitor                 =
    size                    = 200, 50
    rounding                = 3
    outline_thickness       = 0
    hide_input              = false

    inner_color             = $background
    outer_color             = $background
    check_color             = $background

    dots_size               = 0.35
    dots_spacing            = 0.3
    dots_center             = true
    dots_rounding           = -1

    font_family             = $alt
    font_color              = $foreground

    placeholder_text        = PASSCODE
    fail_text               = WRONG PASSCODE <b>($ATTEMPTS)</b>

    fade_on_empty           = false
    fade_timeout            = 200
    fail_transition         = 300

    position                = 485, 70
    halign                  = left
    valign                  = bottom
}



-------------------- WIDGET --------------------

# BATTERY
label {
    monitor             =
    text                = cmd[update:1000] echo -e "$($widget/battery.sh)"
    color               = $foreground
    font_family         = $main Bold
    font_size           = 30


    position            = 520, 260
    halign              = left
    valign              = bottom
    zindex              = 1
}

