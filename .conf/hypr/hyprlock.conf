-------------------- ADJUSTMENT --------------------

# SOURCES
$img                        = ~/.config/hypr/hyprlock/assets
$wallpaper                  = ~/.config/hypr/hyprlock/assets/KANOKARI-Hypr.jpg
$widget                     = ~/biglexj/.config/hypr/hyprlock/battery.sh

# COLORS
$background                 = rgba(42, 208, 163, 0)
$foreground                 = rgba(255, 255, 255, 1.0)
$foreground-alt             = rgba(255, 255, 255, 0.3)
$color1                     = rgba(84, 255, 218, 0.19)
$color2                     = rgba(255, 85, 161, 0.3)

$fail                       = rgba(221, 8, 8, 0.8)

# FONT 
$main                       = Ndot55
$alt                        = LetteraMonoLL Bold
$jp                         = Adobe Hans Sans Bold



--------------------- GENERAL --------------------

general = {k
    disable_loading_bar     = true,
    hide_cursor             = true,
    ignore_empty_input      = true,
    immediate_render        = true
}



-------------------- BACKGROUND --------------------

background {
    monitor                 =
    path                    = $wallpaper
    blur_passes             = 2
    blur_size               = 3
    contrast                = 0.8916
    brightness              = 0.8172
    vibrancy                = 0.1696
    vibrancy_darkness       = 0.0

}



