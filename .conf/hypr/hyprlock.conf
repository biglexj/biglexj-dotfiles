-------------------- TIME & DATE --------------------

# CLOCK-HOUR
label {
    monitor                 =
    text                    = cmd[update:1000] echo "<b><big> $(date +"%I") </big></b>" # 12-h format (%H for 24-h format)
    color                   = $foreground
    font_family             = $main
    font_size               = 230

    position                = 7, -85
    halign                  = left
    valign                  = top
}

# CLOCK-MINUTE
label {
    monitor                 =
    text                    = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color                   = $foreground
    font_family             = $main
    font_size               = 230

    position                = 7, -375
    halign                  = left
    valign                  = top
}

# DATE
label {
    monitor                 =
    text                    = cmd[update:1000] echo -e "$(date +"%a %B %d")"
    color                   = $foreground
    font_family             = $main
    font_size               = 130

    position                = -50, -370
    rotate                  = 90
    halign                  = right
    valign                  = top
}

# YEAR
label {
    monitor                 =
    text                    = cmd[update:1000] echo -e "$(date +"%Y")"
    color                   = $foreground
    font_family             = $alt
    font_size               = 30
    size                    = 200, 50
    rounding                = 5

    position                = -112, -95
    halign                  = right
    valign                  = top
}



