###########################
###    SYSTEM PATH     ###
###    For Biglex J    ###
###########################

# SUPER key
$mainMod = SUPER

# Actions
bind = ctrl, Q, killactive,
bind = $mainMod, K, exit,
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, H, fullscreen # Open the window in fullscreen
bind = $mainMod SHIFT, L, exec, wlogout -b 4 -m 260px
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, V, exec, ~/.config/rofi/assets/clipManager.sh

# Move focus with mainMod + arrow keys
bind = $mainMod SHIFT, left, movefocus, l
bind = $mainMod SHIFT, right, movefocus, r
bind = $mainMod SHIFT, up, movefocus, u
bind = $mainMod SHIFT, down, movefocus, d

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, right, workspace, e+1
bind = $mainMod, left, workspace, e-1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # Scroll workspaces 
bind = $mainMod, mouse_up, workspace, e-1 # Scroll workspaces

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # Move window
bindm = $mainMod, mouse:273, resizewindow # Resize window

# Volume control - Direct method
#binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
#binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Volume control - Script method (comment if using direct method)
bindl= ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh --inc
bindl= ,XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh --dec
bindl= ,XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh --toggle

# Lid
bindl= , switch:off:Lid Switch, exec, systemctl suspend

# Brightness controls
bind =, XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh --inc
bind =, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh --dec 

# Brightness control
#bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
#bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ScreenShot
bind = , Print, exec, hyprshot -m output --clipboard-only

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = , XF86WLAN, exec, nmcli radio wifi toggle
bind = , XF86Refresh, exec, xdotool key F5